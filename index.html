<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>千禧年房东模拟器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --device-gray: #2d2d2d;
            --device-light: #4a4a4a;
            --screen-bg: #9bbc0f;
            --screen-dark: #0f380f;
            --pixel-green: #8bac0f;
            --pixel-light: #9bbc0f;
            --accent-blue: #306230;
            --accent-gold: #c9a227;
            --text-primary: #0f380f;
            --card-bg: #e8f5e9;
            --card-border: #4caf50;
            --debt-red: #c0392b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'VT323', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .pda-device {
            width: 100%;
            max-width: 380px;
            height: 100vh;
            max-height: 720px;
            background: linear-gradient(145deg, #3d3d3d 0%, #2d2d2d 50%, #1d1d1d 100%);
            border-radius: 24px;
            padding: 16px;
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 2px 4px rgba(255, 255, 255, 0.1),
                inset 0 -2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .pda-device::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 6px;
            background: #1a1a1a;
            border-radius: 3px;
        }

        .screen-container {
            flex: 1;
            background: var(--screen-bg);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 
                inset 0 4px 12px rgba(0, 0, 0, 0.3),
                0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        .scanline {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(15, 56, 15, 0.03) 2px,
                rgba(15, 56, 15, 0.03) 4px
            );
            pointer-events: none;
            z-index: 10;
        }

        .news-ticker {
            background: var(--screen-dark);
            color: var(--screen-bg);
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 2px solid var(--accent-blue);
            overflow: hidden;
            white-space: nowrap;
            position: relative;
        }

        .news-ticker-label {
            background: var(--accent-gold);
            color: var(--screen-dark);
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            margin-right: 8px;
        }

        .news-ticker-content {
            display: inline-block;
            animation: ticker 15s linear infinite;
            font-size: 12px;
        }

        @keyframes ticker {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--accent-blue);
            border-radius: 8px;
            margin-bottom: 10px;
            border: 2px solid var(--screen-dark);
        }

        .status-time {
            font-size: 18px;
            color: var(--screen-bg);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-money {
            font-size: 16px;
            color: var(--screen-bg);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-money.deficit {
            color: #e74c3c;
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

 .status-weather {
            font-size: 20px;
        }

        .apartment-view {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            overflow-y: auto;
            padding: 4px;
            background: rgba(15, 56, 15, 0.1);
            border-radius: 8px;
            border: 2px solid var(--screen-dark);
        }

        .apartment-view::-webkit-scrollbar {
            width: 6px;
        }

        .apartment-view::-webkit-scrollbar-track {
            background: var(--pixel-green);
            border-radius: 3px;
        }

        .apartment-view::-webkit-scrollbar-thumb {
            background: var(--screen-dark);
            border-radius: 3px;
        }

        .room-cell {
            aspect-ratio: 1;
            background: var(--pixel-light);
            border: 2px solid var(--screen-dark);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .room-cell:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 8px rgba(15, 56, 15, 0.3);
        }

        .room-cell.rented {
            background: var(--pixel-green);
            border-color: var(--accent-blue);
        }

        .room-cell.npc-present {
            box-shadow: inset 0 0 10px rgba(255, 255, 0, 0.2);
        }

        .room-cell.debt {
            border-color: var(--debt-red);
            animation: debt-flash 2s infinite;
        }

        @keyframes debt-flash {
            0%, 100% { border-color: var(--screen-dark); }
            50% { border-color: var(--debt-red); }
        }

        .room-number {
            font-size: 14px;
            color: var(--screen-dark);
            position: absolute;
            top: 4px;
            left: 6px;
        }

        .room-icon {
            font-size: 28px;
            margin-bottom: 2px;
        }

        .room-status {
            font-size: 11px;
            color: var(--screen-dark);
            text-align: center;
            line-height: 1.2;
        }

        .room-renter {
            font-size: 9px;
            color: var(--accent-blue);
            margin-top: 2px;
        }

        .room-furniture {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 12px;
            display: flex;
            gap: 1px;
        }

        .room-debt-icon {
            position: absolute;
            top: 4px;
            right: 4px;
            font-size: 12px;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .npc-emoji {
            animation: bounce 1.5s ease-in-out infinite;
        }

        .npc-sleeping {
            animation: breathe 2s ease-in-out infinite;
        }

        .npc-working {
            animation: pulse 1s ease-in-out infinite;
        }

        .dock-bar {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 8px;
            background: linear-gradient(180deg, #3d3d3d 0%, #2d2d2d 100%);
            border-radius: 12px;
            margin-top: 12px;
            border: 1px solid #4a4a4a;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .dock-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            min-width: 50px;
        }

        .dock-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .dock-btn:active {
            transform: scale(0.95);
        }

        .dock-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .dock-label {
            font-size: 10px;
            color: #aaa;
            font-family: 'VT323', monospace;
        }

        .notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--screen-dark);
            color: var(--screen-bg);
            padding: 16px 24px;
            border-radius: 8px;
            font-size: 16px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            text-align: center;
            border: 2px solid var(--pixel-green);
            max-width: 90%;
            white-space: pre-line;
        }

        .notification.show {
            opacity: 1;
        }

        .notification.coin {
            animation: coin-flip 0.5s ease-out;
        }

        @keyframes coin-flip {
            0% { transform: translate(-50%, -50%) scale(0.5); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .dialog-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .dialog-overlay.show {
            display: flex;
        }

        .dialog-box {
            background: var(--screen-bg);
            border: 3px solid var(--screen-dark);
            border-radius: 12px;
            padding: 16px;
            max-width: 100%;
            max-height: 85%;
            overflow-y: auto;
            text-align: center;
            width: 100%;
        }

        .dialog-title {
            font-size: 18px;
            color: var(--screen-dark);
            margin-bottom: 12px;
            border-bottom: 2px solid var(--screen-dark);
            padding-bottom: 8px;
        }

        .applicant-card, .furniture-card {
            background: var(--pixel-green);
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            padding: 10px;
            margin: 8px 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .applicant-card:hover, .furniture-card:hover {
            transform: scale(1.02);
            background: var(--accent-blue);
            color: var(--screen-bg);
        }

        .applicant-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .applicant-name {
            font-size: 16px;
            font-weight: bold;
        }

        .applicant-info {
            font-size: 12px;
            margin-top: 4px;
        }

        .applicant-tags {
            font-size: 10px;
            margin-top: 4px;
        }

        .close-btn {
            background: var(--screen-dark);
            color: var(--screen-bg);
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            font-family: 'VT323', monospace;
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
        }

        .close-btn:hover {
            background: var(--accent-blue);
        }

        .need-bars {
            position: absolute;
            bottom: 2px;
            left: 4px;
            right: 30px;
            display: flex;
            gap: 2px;
            font-size: 8px;
        }

        .need-bar {
            flex: 1;
            height: 4px;
            background: var(--screen-dark);
            border-radius: 2px;
            overflow: hidden;
        }

        .need-bar-fill {
            height: 100%;
            transition: width 0.3s ease;
        }

        .need-hunger { background: #ff6b6b; }
        .need-energy { background: #4ecdc4; }
        .need-mood { background: #ffe66d; }

        .money-bar {
            position: absolute;
            bottom: 2px;
            left: 4px;
            right: 4px;
            height: 6px;
            background: var(--screen-dark);
            border-radius: 3px;
            overflow: hidden;
        }

        .money-bar-fill {
            height: 100%;
            transition: width 0.5s ease;
        }

        .money-positive { background: #2ecc71; }
        .money-negative { background: #e74c3c; }

        .lights-on {
            box-shadow: inset 0 0 15px rgba(255, 220, 100, 0.3);
        }

        .rent-display {
            font-size: 10px;
            color: var(--accent-blue);
            position: absolute;
            bottom: 8px;
        }

        .float-text {
            position: absolute;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            z-index: 50;
            animation: float-up 1.5s ease-out forwards;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .float-text.positive {
            color: #2ecc71;
        }

        .float-text.negative {
            color: #e74c3c;
        }

        @keyframes float-up {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.2);
            }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .collection-item {
            background: var(--pixel-green);
            border: 2px solid var(--accent-blue);
            border-radius: 8px;
            padding: 12px;
            margin: 8px 0;
            text-align: left;
        }

        .collection-item.locked {
            opacity: 0.5;
            background: var(--screen-dark);
        }

        .collection-item.unlocked {
            background: var(--pixel-light);
            border-color: var(--accent-gold);
        }

        .collection-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .collection-name {
            font-size: 14px;
            font-weight: bold;
            color: var(--screen-dark);
        }

        .collection-desc {
            font-size: 11px;
            color: var(--accent-blue);
            margin-top: 4px;
        }

        .collection-rarity {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            margin-top: 4px;
            display: inline-block;
        }

        .rarity-common { background: #95a5a6; color: white; }
        .rarity-rare { background: #3498db; color: white; }
        .rarity-epic { background: #9b59b6; color: white; }
        .rarity-legendary { background: #f39c12; color: white; }
    </style>
</head>
<body>
    <div class="pda-device">
        <div class="screen-container">
            <div class="scanline"></div>
            
            <div class="news-ticker">
                <span class="news-ticker-label">📰 新闻</span>
                <span class="news-ticker-content" id="newsTicker">正在加载新闻...</span>
            </div>
            
            <div class="status-bar">
                <div class="status-time">
                    <span id="timeDisplay">🕐 2000-01-01</span>
                    <span id="weekdayDisplay">周六</span>
                </div>
                <div class="status-money" id="moneyContainer">
                    <span>💰</span>
                    <span id="moneyDisplay">5000</span>
                    <span>元</span>
                </div>
                <div class="status-weather">
                    <span id="weatherIcon">☀️</span>
                </div>
            </div>

            <div class="apartment-view" id="apartmentGrid">
            </div>

            <div class="dock-bar">
                <button class="dock-btn" onclick="handleDockClick('rooms')">
                    <span class="dock-icon">🏠</span>
                    <span class="dock-label">房源</span>
                </button>
                <button class="dock-btn" onclick="handleDockClick('tenants')">
                    <span class="dock-icon">👥</span>
                    <span class="dock-label">租客</span>
                </button>
                <button class="dock-btn" onclick="showFurnitureShop()">
                    <span class="dock-icon">🛒</span>
                    <span class="dock-label">商店</span>
                </button>
                <button class="dock-btn" onclick="showPagerSystem()">
                    <span class="dock-icon">📟</span>
                    <span class="dock-label">BP机</span>
                </button>
                <button class="dock-btn" onclick="showCollection()">
                    <span class="dock-icon">📚</span>
                    <span class="dock-label">图鉴</span>
                </button>
                <button class="dock-btn" onclick="showSystemMenu()">
                    <span class="dock-icon">⚙️</span>
                    <span class="dock-label">系统</span>
                </button>
            </div>

            <div class="notification" id="notification"></div>
            
            <div class="dialog-overlay" id="dialogOverlay">
                <div class="dialog-box" id="dialogBox">
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== Save System =====
        const SAVE_KEY = 'millennium_landlord_save';
        let autoSaveEnabled = true;

        function saveGame() {
            const saveData = {
                gameState: {
                    date: gameState.date.toISOString(),
                    money: gameState.money,
                    reputation: gameState.reputation,
                    currentSeason: gameState.currentSeason,
                    currentWeekday: gameState.currentWeekday,
                    dayProgress: gameState.dayProgress,
                    weather: gameState.weather,
                    currentHour: gameState.currentHour
                },
                buildings: buildings,
                npcs: npcs.map(npc => ({
                    id: npc.id,
                    name: npc.name,
                    job: npc.job,
                    salary: npc.salary,
                    personality: npc.personality,
                    age: npc.age,
                    gender: npc.gender,
                    hunger: npc.hunger,
                    energy: npc.energy,
                    mood: npc.mood,
                    money: npc.money,
                    state: npc.state,
                    currentRoom: npc.currentRoom,
                    isHome: npc.isHome,
                    hasDebt: npc.hasDebt,
                    workStartHour: npc.workStartHour,
                    workEndHour: npc.workEndHour,
                    furniture: npc.furniture,
                    canMarry: npc.canMarry,
                    isAdvancedProgrammer: npc.isAdvancedProgrammer
                })),
                collection: collectionData,
                currentNewsIndex: currentNewsIndex,
                activeNewsEffect: activeNewsEffect,
                version: '1.0'
            };

            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
                console.log('💾 游戏已保存');
            } catch (e) {
                console.error('❌ 保存失败:', e);
            }
        }

        function loadGame() {
            try {
                const saveString = localStorage.getItem(SAVE_KEY);
                if (!saveString) {
                    console.log('📂 未找到存档，开始新游戏');
                    return false;
                }

                const saveData = JSON.parse(saveString);

                gameState.date = new Date(saveData.gameState.date);
                gameState.money = saveData.gameState.money;
                gameState.reputation = saveData.gameState.reputation;
                gameState.currentSeason = saveData.gameState.currentSeason;
                gameState.currentWeekday = saveData.gameState.currentWeekday;
                gameState.dayProgress = saveData.gameState.dayProgress;
                gameState.weather = saveData.gameState.weather;
                gameState.currentHour = saveData.gameState.currentHour;

                buildings.length = 0;
                buildings.push(...saveData.buildings);

                npcs.length = 0;
                saveData.npcs.forEach(npcData => {
                    const npc = new NPC(npcData);
                    Object.assign(npc, npcData);
                    npcs.push(npc);
                });

                if (saveData.collection) {
                    collectionData = saveData.collection;
                }

                currentNewsIndex = saveData.currentNewsIndex || 0;
                activeNewsEffect = saveData.activeNewsEffect || null;

                console.log('📂 存档加载成功');
                return true;
            } catch (e) {
                console.error('❌ 加载失败:', e);
                return false;
            }
        }

        function exportSave() {
            const saveData = {
                gameState: {
                    date: gameState.date.toISOString(),
                    money: gameState.money,
                    reputation: gameState.reputation,
                    currentSeason: gameState.currentSeason,
                    currentWeekday: gameState.currentWeekday,
                    dayProgress: gameState.dayProgress,
                    weather: gameState.weather,
                    currentHour: gameState.currentHour
                },
                buildings: buildings,
                npcs: npcs.map(npc => ({
                    id: npc.id,
                    name: npc.name,
                    job: npc.job,
                    salary: npc.salary,
                    personality: npc.personality,
                    age: npc.age,
                    gender: npc.gender,
                    hunger: npc.hunger,
                    energy: npc.energy,
                    mood: npc.mood,
                    money: npc.money,
                    state: npc.state,
                    currentRoom: npc.currentRoom,
                    isHome: npc.isHome,
                    hasDebt: npc.hasDebt,
                    workStartHour: npc.workStartHour,
                    workEndHour: npc.workEndHour,
                    furniture: npc.furniture,
                    canMarry: npc.canMarry,
                    isAdvancedProgrammer: npc.isAdvancedProgrammer
                })),
                collection: collectionData,
                currentNewsIndex: currentNewsIndex,
                activeNewsEffect: activeNewsEffect,
                version: '1.0',
                exportDate: new Date().toISOString()
            };

            const blob = new Blob([JSON.stringify(saveData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `千禧年房东模拟器_${formatDate(gameState.date)}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showNotification('📤 存档导出成功！');
            playSound('success');
        }

        function importSave(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const saveData = JSON.parse(e.target.result);

                    gameState.date = new Date(saveData.gameState.date);
                    gameState.money = saveData.gameState.money;
                    gameState.reputation = saveData.gameState.reputation;
                    gameState.currentSeason = saveData.gameState.currentSeason;
                    gameState.currentWeekday = saveData.gameState.currentWeekday;
                    gameState.dayProgress = saveData.gameState.dayProgress;
                    gameState.weather = saveData.gameState.weather;
                    gameState.currentHour = saveData.gameState.currentHour;

                    buildings.length = 0;
                    buildings.push(...saveData.buildings);

                    npcs.length = 0;
                    saveData.npcs.forEach(npcData => {
                        const npc = new NPC(npcData);
                        Object.assign(npc, npcData);
                        npcs.push(npc);
                    });

                    if (saveData.collection) {
                        collectionData = saveData.collection;
                    }

                    currentNewsIndex = saveData.currentNewsIndex || 0;
                    activeNewsEffect = saveData.activeNewsEffect || null;

                    saveGame();
                    updateUI();
                    closeDialog();

                    showNotification('📥 存档导入成功！');
                    playSound('success');
                } catch (error) {

        // ===== Sound System =====
        let audioContext = null;

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            try {
                initAudio();

                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                const sounds = {
                    click: { freq: 800, duration: 0.1, type: 'square' },
                    success: { freq: 600, duration: 0.15, type: 'sine' },
                    error: { freq: 200, duration: 0.2, type: 'sawtooth' },
                    coin: { freq: 1200, duration: 0.1, type: 'square' },
                    notification: { freq: 500, duration: 0.2, type: 'sine' }
                };

                const sound = sounds[type] || sounds.click;
                oscillator.type = sound.type;
                oscillator.frequency.setValueAtTime(sound.freq, audioContext.currentTime);

                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + sound.duration);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + sound.duration);
            } catch (e) {
                console.log('音效播放失败:', e);
            }
        }

                this.currentRoom = data.currentRoom || null;

            generateFamilyBackground() {
                const rand = Math.random();
                if (rand < 0.1) {
                    return { level: '特困', parentJobs: ['无业', '无业'], description: '家境特别困难' };
                } else if (rand < 0.2) {
                    return { level: '贫困', parentJobs: ['工人', '无业'], description: '家境贫困' };
                } else if (rand < 0.9) {
                    const jobs = ['工人', '教师', '文员', '销售'];
                    return { level: '一般', parentJobs: [jobs[Math.floor(Math.random() * jobs.length)], jobs[Math.floor(Math.random() * jobs.length)]], description: '普通家庭' };
                } else {
                    return { level: '豪门', parentJobs: ['企业家', '医生'], description: '家境富裕' };
                }
            }
            
            generateGoal() {
                const goals = [

                    '攒钱买房',
                    '学习新技能',
                    '孝敬父母',
                    '环游世界',
                    '创业成功'
                ];
                return goals[Math.floor(Math.random() * goals.length)];

                const timestamp = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

                if (this.dailyLog.length > 50) {

                    '自由职业': '🎨',
                    '服务员': '👨‍🍳'
                };
                return jobEmojis[this.job] || '🧑';
            }

            getStateEmoji() {
                const stateEmojis = {
                    'idle': '🧘',
                    'working': this.getJobEmoji(),
                    'sleeping': '💤',
                    'eating': '🍜',
                    'bathing': '🚿',
                    'toilet': '🚽',
                    'relaxing': '📺',
                    'out': '🚶',
                    'unemployed': '😢',
                    'dating': '💑',
                    'shopping': '🛒'
                };
                return stateEmojis[this.state] || '🧘';
            }

            getAnimationClass() {
                if (this.state === 'sleeping') return 'npc-sleeping';
                if (this.state === 'working') return 'npc-working';
                if (this.state === 'unemployed') return 'npc-sleeping';
                return 'npc-emoji';
            }

            updateNeeds() {
                this.hunger = Math.max(0, this.hunger - 0.5);
                this.energy = Math.max(0, this.energy - 0.3);
                this.mood = Math.max(0, this.mood - 0.2);
                this.thirst = Math.max(0, this.thirst - 0.4);
                this.bladder = Math.max(0, this.bladder - 0.6);

                if (this.bladder < 20) {
                    this.state = 'toilet';
                    this.useToilet();
                } else if (this.hunger < 30 || this.thirst < 30) {
                    this.state = 'eating';
                    this.eat();
                } else if (this.energy < 20) {
                    this.state = 'sleeping';
                } else if (this.mood < 30) {
                    this.state = 'relaxing';
                }
            }
            
            useToilet() {
                this.bladder = 100;
                this.addDailyLog('上厕所');
            }

            eat() {
                if (this.money >= 10) {
                    this.money -= 10;
                    this.hunger = Math.min(100, this.hunger + 40);
                    this.thirst = Math.min(100, this.thirst + 30);
                    this.mood = Math.min(100, this.mood + 5);
                    this.addDailyLog('吃饭');
                }
            }

            payRent(rentAmount) {
                if (this.money >= rentAmount) {
                    this.money -= rentAmount;
                    this.hasDebt = false;
                    return true;
                } else {
                    this.hasDebt = true;
                    return false;
                }
            }

                        this.job = '无业';
                        this.state = 'unemployed';
                        this.isHome = true;
                        this.addDailyLog('失业了');
                        return;
                    }
                }

                const prevState = this.state;
                const isWorkHour = hour >= this.workStartHour && hour < this.workEndHour;
                const isNight = hour >= 22 || hour < 6;
                const isEvening = hour >= 18 && hour < 22;

                if (this.job === '无业' || this.state === 'unemployed') {
                    if (isNight) {
                        this.state = 'sleeping';
                        this.isHome = true;
                    } else if (Math.random() < 0.3) {
                        this.state = 'out';
                        this.isHome = false;
                    } else {
                        this.state = 'idle';
                        this.isHome = true;
                    }
                } else if (isWorkHour && !isWeekend) {
                    this.state = 'working';
                    this.isHome = false;
                    if (prevState !== 'working') {
                        this.addDailyLog('去上班');
                    }
                } else if (isNight) {
                    this.state = 'sleeping';
                    this.isHome = true;
                    if (prevState !== 'sleeping' && hour === 22) {
                        this.addDailyLog('准备睡觉');
                    }
                } else if (isEvening) {
                    this.state = 'relaxing';
                    this.isHome = true;
                    if (prevState === 'working' && hour === 18) {
                        this.addDailyLog('下班回家');
                    }
                } else if (hour >= 6 && hour < 9) {
                    this.state = 'idle';
                    this.isHome = true;
                    if (hour === 6 && prevState === 'sleeping') {
                        this.addDailyLog('起床');
                    }
                } else {
                    if (Math.random() < 0.2) {
                        this.state = 'out';
                        this.isHome = false;
                        if (prevState !== 'out') {
                            const activities = ['去超市购物', '去公园散步', '拜访朋友', '去邮局'];
                            this.addDailyLog(activities[Math.floor(Math.random() * activities.length)]);
                        }
                    } else {
                        this.state = 'idle';
                        this.isHome = true;
                    }
                }

                this.updateNeeds();
            }

            restoreNeeds() {
                if (this.state === 'eating') {
                    this.hunger = Math.min(100, this.hunger + 40);
                    this.thirst = Math.min(100, this.thirst + 30);
                    this.mood = Math.min(100, this.mood + 5);
                } else if (this.state === 'sleeping') {
                    this.energy = Math.min(100, this.energy + 60);
                } else if (this.state === 'relaxing') {
                    this.mood = Math.min(100, this.mood + 20);
                } else if (this.state === 'toilet') {
                    this.bladder = 100;
                }
            }
        }

        // ===== Core Game Data Structures =====
        const gameState = {

        // ===== Time System =====
        const TIME_SCALE = 10;
        const MINUTES_PER_DAY = 24 * 60;
        const UPDATE_INTERVAL = 1000;

        // ===== Utility Functions =====
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getWeekday(date) {
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            return weekdays[date.getDay()];
        }

        function getSeason(date) {
            const month = date.getMonth();
            if (month >= 2 && month <= 4) return 'spring';
            if (month >= 5 && month <= 7) return 'summer';
            if (month >= 8 && month <= 10) return 'autumn';
            return 'winter';
        }

        function getWeatherEmoji(weather) {
            const weathers = { sunny: '☀️', cloudy: '☁️', rainy: '🌧️', snowy: '🌨️' };
            return weathers[weather] || '☀️';
        }

        function getDayNightEmoji(hour) {
            if (hour >= 6 && hour < 12) return '🌅';
            if (hour >= 12 && hour < 18) return '☀️';
            if (hour >= 18 && hour < 22) return '🌆';
            return '🌙';
        }

        function isWeekend() {
            return gameState.currentWeekday === 0 || gameState.currentWeekday === 6;
        }

        // ===== Core Game Functions =====
        function updateTime() {
            gameState.dayProgress += TIME_SCALE;
            
            const totalMinutes = gameState.dayProgress;
            gameState.currentHour = Math.floor(totalMinutes / 60);
            
            npcs.forEach(npc => {
                npc.updateBehavior(gameState.currentHour, isWeekend());
                if (npc.isHome && ['sleeping', 'eating', 'relaxing'].includes(npc.state)) {
                    npc.restoreNeeds();
                }
            });
            
            if (gameState.dayProgress >= MINUTES_PER_DAY) {
                gameState.dayProgress = 0;
                advanceDay();
            }
            
            updateUI();
        }

        function advanceDay() {
            gameState.date.setDate(gameState.date.getDate() + 1);
            gameState.currentWeekday = (gameState.currentWeekday + 1) % 7;
            gameState.currentSeason = getSeason(gameState.date);
            
            if (Math.random() < 0.2) {
                const weathers = ['sunny', 'cloudy', 'rainy', 'snowy'];
                gameState.weather = weathers[Math.floor(Math.random() * weathers.length)];
            }
            
            if (gameState.date.getDate() === 1) {
                collectMonthlyRent();
                payMonthlySalaries();
            }
            
            updateNewsTicker();

            npcs.forEach(npc => {
                checkCollection(npc);
                npc.dailyLog = []; // Reset daily log each day
            });
            
            // Random events
            if (Math.random() < 0.3 && npcs.length > 0) {
                triggerRandomEvent();
            }
            
            // NPC interactions
            if (Math.random() < 0.2 && npcs.length >= 2) {
                triggerNPCInteraction();
            }

            saveGame();
        }
        
        function payMonthlySalaries() {
            npcs.forEach(npc => {
                if (npc.job !== '无业') {
                    npc.money += npc.salary;
                    npc.addDailyLog(`收到工资 +${npc.salary}元`);
                }
            });
        }

                },
                {
                    name: '公用电话占线',

                    effect: (npc) => { npc.mood = Math.max(0, npc.mood - 15); }
                },
                {
                    name: '楼下烧烤聚会',
                    desc: (npc) => `${npc.name}参加了楼下的烧烤聚会`,
                    effect: (npc) => { npc.mood = Math.min(100, npc.mood + 20); npc.hunger = Math.min(100, npc.hunger + 30); }
                },
                {
                    name: '捡到钱包',
                    desc: (npc) => `${npc.name}在路上捡到了一个钱包，里面有50元`,
                    effect: (npc) => { npc.money += 50; npc.mood = Math.min(100, npc.mood + 10); }
                },
                {

                    effect: (npc) => { if (npc.job !== '无业') { npc.energy = Math.max(0, npc.energy - 30); npc.money += 100; } }
                }
            ];
            
            const npc = npcs[Math.floor(Math.random() * npcs.length)];
            const event = events[Math.floor(Math.random() * events.length)];
            
            event.effect(npc);
            npc.addDailyLog(event.name);
            showNotification(`📰 ${event.desc(npc)}`);
        }
        
        function triggerNPCInteraction() {
            if (npcs.length < 2) return;
            
            const npc1 = npcs[Math.floor(Math.random() * npcs.length)];
            let npc2 = npcs[Math.floor(Math.random() * npcs.length)];
            while (npc2.id === npc1.id && npcs.length > 1) {
                npc2 = npcs[Math.floor(Math.random() * npcs.length)];
            }
            
            const interactions = [
                {
                    desc: `${npc1.name}和${npc2.name}在走廊上闲聊了几句`,
                    effect: () => {
                        npc1.mood = Math.min(100, npc1.mood + 5);
                        npc2.mood = Math.min(100, npc2.mood + 5);
                        if (!npc1.friends.includes(npc2.name)) npc1.friends.push(npc2.name);
                        if (!npc2.friends.includes(npc1.name)) npc2.friends.push(npc1.name);
                    }
                },
                {
                    desc: `${npc1.name}帮${npc2.name}代收了快递`,
                    effect: () => {
                        npc1.mood = Math.min(100, npc1.mood + 3);
                        npc2.mood = Math.min(100, npc2.mood + 8);
                    }
                },
                {
                    desc: `${npc1.name}和${npc2.name}因为洗衣机使用发生了小争执`,
                    effect: () => {
                        npc1.mood = Math.max(0, npc1.mood - 10);
                        npc2.mood = Math.max(0, npc2.mood - 10);
                    }
                }
            ];
            
            const interaction = interactions[Math.floor(Math.random() * interactions.length)];
            interaction.effect();
            npc1.addDailyLog(interaction.desc);
            npc2.addDailyLog(interaction.desc);
        }

        function collectMonthlyRent() {
            let totalRent = 0;
            let debtCount = 0;
            
            buildings.forEach(room => {
                if (room.status === 'rented' && room.renter) {
                    const npc = npcs.find(n => n.currentRoom === room.id);
                    if (npc) {
                        const paid = npc.payRent(room.rent);
                        if (paid) {
                            totalRent += room.rent;
                            
                            // Show float text on the room
                            const roomCell = document.querySelector(`[onclick*="${room.id}"]`);
                            if (roomCell) {
                                setTimeout(() => {
                                    const rect = roomCell.getBoundingClientRect();
                                    const containerRect = document.querySelector('.screen-container').getBoundingClientRect();
                                    const x = rect.left - containerRect.left + rect.width / 2;
                                    const y = rect.top - containerRect.top;
                                    showFloatText(`+${room.rent}元`, x, y, true);
                                }, Math.random() * 500);
                            }
                        } else {
                            debtCount++;
                        }
                    }
                }
            });
            
            if (totalRent > 0) {
                gameState.money += totalRent;
                showNotificationWithEffect(`🎉 收取租金 +${totalRent}元`, true);
                playSound('coin');
            }
            
            if (debtCount > 0) {
                showNotification(`⚠️ ${debtCount}位租客拖欠房租！`);
                playSound('error');
            }
        }

        function showNotificationWithEffect(message, isCoin) {

                const marriageStatus = npc.isMarried ? `💍 已婚 (配偶: ${npc.spouse})` : '💔 单身';
                html += `<div>${marriageStatus}</div>`;
                html += `<div>💋 初吻: ${npc.firstKiss || '未发生'}</div>`;
                html += `<div>🌸 ${npc.isVirgin ? '是' : '否'}处子之身</div>`;
                
                if (npc.children && npc.children.length > 0) {
                    html += `<div>👶 子女: ${npc.children.length}人</div>`;
                }
                
                if (npc.friends && npc.friends.length > 0) {
                    html += `<div>👥 好友: ${npc.friends.join(', ')}</div>`;
                }
                
                html += `<div style="margin-top:8px;"><strong>当前目标:</strong></div>`;
                html += `<div>🎯 ${npc.currentGoal}</div>`;
                
                if (npc.inventory && npc.inventory.length > 0) {
                    html += `<div style="margin-top:8px;"><strong>🎒 背包物品:</strong></div>`;
                    html += `<div>${npc.inventory.join(', ')}</div>`;
                }
                
                if (npc.dailyLog && npc.dailyLog.length > 0) {
                    html += `<div style="margin-top:8px;"><strong>📝 今日动态 (最近5条):</strong></div>`;
                    const recentLogs = npc.dailyLog.slice(-5);
                    recentLogs.forEach(log => {
                        html += `<div style="font-size:11px;">⏰ ${log.time} - ${log.action}</div>`;
                    });
                }
                
                if (npc.hasDebt) {
                    html += `<div style="color:#c0392b;margin-top:8px;">⚠️ 欠租状态！</div>`;
                }
                
                // Add interaction buttons
                html += `<div style="margin-top:12px;">`;
                html += `<button class="close-btn" style="background:var(--accent-blue);margin:2px;" onclick="interactWithNPC(${npc.id}, 'chat')">💬 聊天</button>`;
                if (!npc.isMarried && npc.affection >= 50) {
                    html += `<button class="close-btn" style="background:var(--accent-gold);margin:2px;" onclick="interactWithNPC(${npc.id}, 'date')">💑 约会</button>`;
                }
                if (!npc.isMarried && npc.affection >= 80) {
                    html += `<button class="close-btn" style="background:#e74c3c;margin:2px;" onclick="interactWithNPC(${npc.id}, 'confess')">💖 告白</button>`;
                }
                html += `</div>`;
            }
            
            html += `</div>`;
            html += `<button class="close-btn" onclick="closeDialog()">返回</button>`;
            html += `<button class="close-btn" style="margin-left:10px;background:var(--accent-gold);color:var(--screen-dark)" onclick="showFurnitureShopForRoom(${room.id})">🛒 购买家具</button>`;
            
            box.innerHTML = html;
            overlay.classList.add('show');
        }

        function showRentalDialog(room) {
            const overlay = document.getElementById('dialogOverlay');
            const box = document.getElementById('dialogBox');
            
            const applicants = [generateApplicant(), generateApplicant(), generateApplicant()];
            
            let html = `<div class="dialog-title">🏠 房间 ${room.id} 招租</div>`;
            
            applicants.forEach((app, index) => {
                const genderEmoji = app.gender === 'male' ? '👨' : '👩';
                const canAfford = app.salary >= room.rent * 1.2;
                
                html += `
                    <div class="applicant-card ${canAfford ? '' : 'disabled'}" onclick="${canAfford ? `selectApplicant(${room.id}, ${index})` : ''}">
                        <div class="applicant-name">${genderEmoji} ${app.name}</div>
                        <div class="applicant-info">职业: ${app.job} | 月薪: ${app.salary}元</div>
                        <div class="applicant-tags">🏷️ ${app.personality.tag} | 年龄: ${app.age}岁</div>
                        ${canAfford ? '' : '<div style="color:#c0392b">⚠️ 收入不足</div>'}
                    </div>
                `;
            });
            
            html += `<button class="close-btn" onclick="closeDialog()">取消</button>`;
            
            window.currentApplicants = applicants;
            window.currentRoom = room;
            
            box.innerHTML = html;
            overlay.classList.add('show');
        }

        function selectApplicant(roomId, index) {
            const room = buildings.find(b => b.id === roomId);
            const applicant = window.currentApplicants[index];
            
            const npc = new NPC({
                id: applicant.id,
                name: applicant.name,
                job: applicant.job,
                salary: applicant.salary,
                personality: applicant.personality,
                age: applicant.age,
                gender: applicant.gender
            });
            
            npc.currentRoom = roomId;
            npc.workStartHour = jobConfig[applicant.job].workStart;
            npc.workEndHour = jobConfig[applicant.job].workEnd;
            
            npcs.push(npc);
            
            room.status = 'rented';
            room.renter = {
                name: applicant.name,
                job: applicant.job,
                salary: applicant.salary
            };
            
            closeDialog();
            showNotificationWithEffect(`🎉 ${applicant.name} 入住房间 ${roomId}！`, true);
            playSound('success');
            
            // Check collection for new tenant
            checkCollection(npc);
            
            window.currentApplicants = null;
            window.currentRoom = null;
            
            saveGame();
        }

        function showFurnitureShop() {
            const overlay = document.getElementById('dialogOverlay');
            const box = document.getElementById('dialogBox');
            
            let html = `<div class="dialog-title">🛒 家具商店</div>`;
            html += `<div style="text-align:left;margin-bottom:10px;">💰 当前资金: ${gameState.money}元</div>`;
            
            Object.entries(furnitureCatalog).forEach(([name, item]) => {
                html += `
                    <div class="furniture-card" onclick="handleFurniturePurchase('${name}')">
                        <div class="applicant-name">${item.icon} ${name}</div>
                        <div class="applicant-info">💵 价格: ${item.price}元 | 🪑 舒适度: +${item.comfort}</div>
                        <div class="applicant-tags">${item.desc}</div>
                    </div>
                `;
            });
            
            html += `<button class="close-btn" onclick="closeDialog()">关闭</button>`;
            
            box.innerHTML = html;
            overlay.classList.add('show');
            playSound('click');
        }

        function showFurnitureShopForRoom(roomId) {
            closeDialog();
            
            const overlay = document.getElementById('dialogOverlay');
            const box = document.getElementById('dialogBox');
            const room = buildings.find(b => b.id === roomId);
            
            let html = `<div class="dialog-title">🛒 为房间 ${roomId} 购买家具</div>`;
            html += `<div style="text-align:left;margin-bottom:10px;">💰 当前资金: ${gameState.money}元</div>`;
            
            if (room.furniture && room.furniture.length > 0) {
                html += `<div style="text-align:left;margin-bottom:10px;">已有家具: ${room.furniture.join(', ')}</div>`;
            }
            
            Object.entries(furnitureCatalog).forEach(([name, item]) => {
                const hasFurniture = room.furniture && room.furniture.includes(name);
                const canAfford = gameState.money >= item.price;
                const disabled = hasFurniture || !canAfford;
                
                html += `
                    <div class="furniture-card ${disabled ? 'disabled' : ''}" onclick="${disabled ? '' : `buyFurnitureForRoom(${roomId}, '${name}')`}">
                        <div class="applicant-name">${item.icon} ${name} ${hasFurniture ? '✓' : ''}</div>
                        <div class="applicant-info">💵 价格: ${item.price}元 | 🪑 舒适度: +${item.comfort}</div>
                        <div class="applicant-tags">${item.desc}</div>
                        ${!canAfford ? '<div style="color:#c0392b">⚠️ 资金不足</div>' : ''}
                    </div>
                `;
            });
            
            html += `<button class="close-btn" onclick="closeDialog()">返回</button>`;
            
            box.innerHTML = html;
            overlay.classList.add('show');
        }

        function buyFurnitureForRoom(roomId, furnitureName) {
            const room = buildings.find(b => b.id === roomId);
            const item = furnitureCatalog[furnitureName];
            
            if (!room.furniture) {
                room.furniture = [];
            }
            
            if (gameState.money >= item.price && !room.furniture.includes(furnitureName)) {
                gameState.money -= item.price;
                room.furniture.push(furnitureName);
                room.comfort += item.comfort;
                
                // Apply furniture effects
                const npc = npcs.find(n => n.currentRoom === roomId);
                if (npc) {
                    if (furnitureName === '56k调制解调器' && npc.job === '程序员') {
                        npc.isAdvancedProgrammer = true;
                        npc.job = '高级程序员';
                        npc.salary = jobConfig['高级程序员'].base;
                        npc.workStartHour = 9;
                        npc.workEndHour = 21;
                    }
                    if (furnitureName === '双人床') {
                        npc.canMarry = true;
                    }
                }
                
                // Update rent based on comfort
                room.rent = Math.floor(room.rent * (1 + item.comfort / 200));
                
                showNotificationWithEffect(`🛒 购买成功！\n-${item.price}元\n+${item.comfort}舒适度`, false);
                playSound('success');
                
                // Show float text on the room
                const roomCell = document.querySelector(`[onclick*="${roomId}"]`);
                if (roomCell) {
                    const rect = roomCell.getBoundingClientRect();
                    const containerRect = document.querySelector('.screen-container').getBoundingClientRect();
                    const x = rect.left - containerRect.left + rect.width / 2;
                    const y = rect.top - containerRect.top;
                    showFloatText(`-${item.price}元`, x, y, false);
                }
                
                // Refresh the furniture shop
                showFurnitureShopForRoom(roomId);
                updateUI();
            }
        }

        function handleFurniturePurchase(name) {
            showNotification('请先选择一个房间\n然后购买家具');
        }

        // ===== NPC Interaction System =====
        function interactWithNPC(npcId, actionType) {
            const npc = npcs.find(n => n.id === npcId);
            if (!npc) return;
            
            playSound('click');
            
            if (actionType === 'chat') {
                handleChat(npc);
            } else if (actionType === 'date') {
                handleDate(npc);
            } else if (actionType === 'confess') {
                handleConfess(npc);
            }
        }
        
        function handleChat(npc) {
            const topics = [
                { text: '聊聊工作', affection: 5 },
                { text: '聊聊爱好', affection: 8 },
                { text: '聊聊家人', affection: 10 }
            ];
            
            const topic = topics[Math.floor(Math.random() * topics.length)];
            npc.affection = Math.min(100, npc.affection + topic.affection);
            npc.mood = Math.min(100, npc.mood + 10);
            npc.addDailyLog(`与房东聊天 (+${topic.affection}好感)`);
            
            const responses = [
                `${npc.name}："${topic.text}吗？我也很感兴趣！"`,
                `${npc.name}开心地和你聊了起来`,
                `你们聊得很投机，${npc.name}心情不错`
            ];
            
            showNotification(responses[Math.floor(Math.random() * responses.length)] + `\n💖好感度: ${npc.affection}/100`);
            closeDialog();
            updateUI();
        }
        
        function handleDate(npc) {
            if (gameState.money < 100) {
                showNotification('💸 资金不足！约会至少需要100元');
                return;
            }
            
            const dateEvents = [
                { name: '录像厅看《大话西游》', cost: 60, affection: 15, desc: '你们在录像厅看了一场《大话西游》' },
                { name: 'BP机寻宝游戏', cost: 50, affection: 12, desc: '你们玩了一场有趣的BP机寻宝游戏' },
                { name: '家电城闲逛', cost: 30, affection: 10, desc: '你们一起去家电城看新款电器' }
            ];
            
            const event = dateEvents[Math.floor(Math.random() * dateEvents.length)];
            
            gameState.money -= event.cost;
            npc.affection = Math.min(100, npc.affection + event.affection);
            npc.mood = Math.min(100, npc.mood + 20);
            npc.addDailyLog(`约会：${event.name}`);
            
            showNotification(`💑 ${event.desc}\n花费：${event.cost}元\n💖好感度: ${npc.affection}/100`);
            closeDialog();
            updateUI();
        }
        
        function handleConfess(npc) {
            const overlay = document.getElementById('dialogOverlay');
            const box = document.getElementById('dialogBox');
            
            let html = `<div class="dialog-title">💖 向${npc.name}告白</div>`;
            html += `<div style="text-align:center;margin:20px 0;">`;
            html += `<div style="font-size:16px;margin-bottom:15px;">🌟 在天台烛光下...</div>`;
            html += `<div style="margin:10px 0;">选择你的告白方式：</div>`;
            html += `</div>`;
            
            html += `<button class="close-btn" style="background:#e74c3c;margin:5px;" onclick="doConfess(${npc.id}, 1)">💐 "我喜欢你，做我女朋友吧"</button>`;
            html += `<button class="close-btn" style="background:#e74c3c;margin:5px;" onclick="doConfess(${npc.id}, 2)">🌹 "从第一次见你，我就心动了"</button>`;
            html += `<button class="close-btn" style="background:#95a5a6;margin:5px;" onclick="closeDialog()">❌ 放弃告白</button>`;
            
            box.innerHTML = html;
        }
        
        function doConfess(npcId, choice) {
            const npc = npcs.find(n => n.id === npcId);
            if (!npc) return;
            
            const successChance = npc.affection / 100 * 0.8 + (npc.appearance > 50 ? 0.1 : 0);
            const success = Math.random() < successChance || npc.affection >= 90;
            
            if (success) {
                npc.loveHistory.push({ type: 'relationship_start', date: new Date(gameState.date) });
                npc.firstKiss = npc.firstKiss || formatDate(gameState.date);
                npc.affection = 100;
                npc.mood = 100;
                npc.addDailyLog(`接受了告白 💖`);
                
                showNotification(`💕 ${npc.name}害羞地答应了！\n你们正式成为情侣！\n💋 初吻记录已更新`);
                playSound('success');
            } else {
                npc.affection = Math.max(0, npc.affection - 20);
                npc.mood = Math.max(0, npc.mood - 30);
                npc.addDailyLog(`婉拒了告白`);
                
                showNotification(`💔 ${npc.name}："对不起，我们还是做朋友吧..."\n好感度-20`);
                playSound('error');
            }
            
            closeDialog();
            updateUI();
        }

        function closeDialog() {
            const overlay = document.getElementById('dialogOverlay');
            overlay.classList.remove('show');
            playSound('click');
        }

        function handleDockClick(section) {
            const messages = {
                rooms: '🏠 房源管理\n点击空房间招租',
                tenants: `👥 租客管理\n当前租客: ${npcs.length}人`,
                shop: '🛒 家具商店\n选择房间购买家具',
                events: '📋 事件日志\n查看新闻了解局势',
                menu: '☰ 菜单\n功能开发中...'
            };
            
            showNotification(messages[section] || '功能开发中');
            playSound('click');
        }

        function showNotification(message) {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.classList.add('show');
            
            setTimeout(() => {
                notif.classList.remove('show');
            }, 2500);
        }

        // ===== Initialize Game =====
        function initGame() {
            console.log('🎮 千禧年房东模拟器 初始化中...');
            
            // Try to load save first
            const loaded = loadGame();
            
            if (loaded) {
                console.log('📅 存档日期:', formatDate(gameState.date));
                console.log('💰 当前资金:', gameState.money, '元');
                console.log('🏠 房间数量:', buildings.length);
                console.log('👥 租客数量:', npcs.length);
                console.log('📚 图鉴收集:', collectionData.unlocked.length, '/', specialTenants.length);
            } else {
                console.log('📅 起始日期:', formatDate(gameState.date));
                console.log('💰 初始资金:', gameState.money, '元');
                console.log('🏠 房间数量:', buildings.length);
            }
            
            updateUI();
            updateNewsTicker();
            
            setInterval(updateTime, UPDATE_INTERVAL);
            
            if (loaded) {
                showNotification('📂 存档加载成功！\n欢迎回来！');
            } else {
                showNotification('🎮 欢迎来到千禧年房东模拟器！\n2000年1月1日\n点击空房间开始招租');
            }
            
            playSound('notification');
        }

        window.onload = initGame;
    </script>
</body>
</html>
